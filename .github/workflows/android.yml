name: Android CI

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Android SDK setup
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then SDKMGR="$(command -v sdkmanager || true)"; fi

          if [ -n "$SDKMGR" ] && [ -x "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            # Package names are minor-versioned on current images (android-37.0).
            # Failures here are non-fatal: AGP can download what it needs once
            # the licences are accepted, and the images ship a usable SDK.
            for pkg in "platform-tools" "build-tools;36.0.0" "platforms;android-37.0"; do
              "$SDKMGR" "$pkg" > /dev/null 2>&1 \
                || echo "::warning title=Android SDK::could not install $pkg (continuing)"
            done
          else
            echo "::warning title=Android SDK::sdkmanager not found, relying on the preinstalled SDK"
          fi

          PLATFORMS="$(ls "$SDK/platforms" 2>/dev/null | tr '\n' ' ')"
          BUILD_TOOLS="$(ls "$SDK/build-tools" 2>/dev/null | tr '\n' ' ')"
          echo "platforms: $PLATFORMS"
          echo "build-tools: $BUILD_TOOLS"
          {
            echo "### Android SDK"
            echo "- platforms: \`$PLATFORMS\`"
            echo "- build-tools: \`$BUILD_TOOLS\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Latest published dependency versions (reference)
        run: |
          python3 - <<'PY' > "$RUNNER_TEMP/versions.txt"
          import re
          import urllib.request

          artifacts = [
              "androidx/core/core-ktx",
              "androidx/activity/activity-compose",
              "androidx/lifecycle/lifecycle-viewmodel-compose",
              "androidx/compose/compose-bom",
              "com/android/tools/build/gradle",
          ]
          out = []
          for artifact in artifacts:
              url = f"https://dl.google.com/dl/android/maven2/{artifact}/maven-metadata.xml"
              try:
                  xml = urllib.request.urlopen(url, timeout=30).read().decode()
                  versions = re.findall(r"<version>([^<]+)</version>", xml)
                  stable = [v for v in versions if not re.search(r"alpha|beta|rc|dev", v, re.I)]
                  out.append(f"{artifact} latest={versions[-1] if versions else '?'} stable={stable[-1] if stable else '?'}")
              except Exception as exc:  # noqa: BLE001
                  out.append(f"{artifact} lookup failed: {exc}")
          print(" | ".join(out))
          PY
          cat "$RUNNER_TEMP/versions.txt"
          echo "::notice title=Latest published versions::$(tr -d '\n' < "$RUNNER_TEMP/versions.txt")"

      - name: Print toolchain versions
        run: ./gradlew --version --console=plain

      - name: Assemble debug
        run: |
          set +e
          ./gradlew assembleDebug --stacktrace --console=plain > "$RUNNER_TEMP/gradle.log" 2>&1
          status=$?

          if [ "$status" -ne 0 ]; then
            {
              echo "### Gradle failure"
              echo '```'
              tail -c 12000 "$RUNNER_TEMP/gradle.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            diagnostics=$(grep -nE "^(e: |FAILURE|Caused by|> )|\* What went wrong|Execution failed|Could not (find|resolve|determine)|error:|Unresolved reference|error: " "$RUNNER_TEMP/gradle.log" \
              | tail -40 \
              | sed -e 's/%/%25/g' -e 's/\r//g' \
              | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle failure::${diagnostics}"
          else
            echo "### Build succeeded" >> "$GITHUB_STEP_SUMMARY"
          fi

          exit $status

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Inspect debug APK
        if: success()
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          AAPT2="$(ls "$SDK"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)"

          SIZE="$(du -h "$APK" | cut -f1)"
          SHA="$(sha256sum "$APK" | cut -c1-16)"
          BADGING="$("$AAPT2" dump badging "$APK" 2>/dev/null | grep -E "^package:|^application-label:|^launchable-activity:|^sdkVersion:|^targetSdkVersion:" | tr '\n' ' ')"

          {
            echo "### Debug APK"
            echo "- size: $SIZE"
            echo "- sha256 (short): $SHA"
            echo "- \`$BADGING\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Debug APK::$SIZE | $BADGING"
